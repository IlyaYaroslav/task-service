name: Task Service CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: task-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "26"
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/task-service' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tasks
        ports:
          - 5431:5432
        options: >-
          --health-cmd "pg_isready -U admin -d tasks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: local
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5431/tasks
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: password

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build executable JAR
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon
          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$JAR_FILE"
          mkdir -p staging
          cp "$JAR_FILE" staging/task-service.jar
          cp Dockerfile docker-compose.deploy.yml staging/

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: task-service-${{ github.sha }}
          path: staging/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v8
        with:
          name: task-service-${{ github.sha }}
          path: artifact

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy Docker container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          test -n "$DEPLOY_USER"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"
          scp -P "$DEPLOY_PORT" \
            artifact/task-service.jar \
            artifact/Dockerfile \
            artifact/docker-compose.deploy.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          test -s task-service.env
          docker compose -f docker-compose.deploy.yml build --pull task-service

          sudo systemctl stop task-service 2>/dev/null || true

          rollback() {
            docker compose -f docker-compose.deploy.yml down || true
            sudo systemctl start task-service 2>/dev/null || true
          }
          trap rollback ERR

          docker compose -f docker-compose.deploy.yml up -d task-service

          for attempt in $(seq 1 18); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' task-service 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ] || [ "$attempt" -eq 18 ]; then
              docker logs --tail 200 task-service || true
              exit 1
            fi
            sleep 5
          done

          curl --fail --silent --show-error \
            http://127.0.0.1:8084/api/task-service/users >/dev/null
          sudo systemctl disable task-service 2>/dev/null || true
          trap - ERR

          docker ps --filter name=task-service
          REMOTE_SCRIPT
