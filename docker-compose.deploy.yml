services:
  task-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-service:latest
    container_name: task-service
    restart: unless-stopped
    env_file:
      - task-service.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/tasks
      USER_SERVICE_URL: http://host.docker.internal:8081/api/user-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8084:8080"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - taskspace-net

networks:
  taskspace-net:
    external: true
