databaseChangeLog:
  - changeSet:
      id: 002-project-fields-and-members
      author: codex
      changes:
        - addColumn:
            tableName: project
            columns:
              - column:
                  name: project_key
                  type: varchar(10)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(2000)
              - column:
                  name: owner_id
                  type: uuid
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - createTable:
            tableName: project_members
            columns:
              - column:
                  name: project_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_project_members_project
                    references: project(id)
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: project_members
            columnNames: project_id, user_id
            constraintName: pk_project_members
